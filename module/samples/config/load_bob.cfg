# PSP2SPL configuration script
*BOOT # this section is executed on psp2spl reset
LV0_STACK=0x1F860000 # Required since bob can be bigger than SK, assuming we dont fill spad128k
LV0_DAT=0x00040000,uma0:/bob.bin # Read to priv128k
LV0_EXE=0xB0B01A9B,0x000400B0 # init(mh0 | mh1 | uartClk | (uartSet|uartBus|resetTest|testDefault|mb1))
